# Create, overwrite or update /etc/default/grub in the target system.
#
# Write lines to /etc/default/grub (in the target system) based
# on calculated values and the values set in the *defaults* key
# in this configuration file.
#
# Calculated values are:
#   - GRUB_DISTRIBUTOR,   branding module, *bootloaderEntryName* (this
#     string is sanitized, and see also setting *keepDistributor*)
#   - GRUB_ENABLE_CRYPTODISK, based on the presence of filesystems
#     that use LUKS
#   - GRUB_CMDLINE_LINUX_DEFAULT, adding LUKS setup and plymouth
#     support to the kernel.

---
# If set to true, always creates /etc/default/grub from scratch even if the file
# already existed. If set to false, edits the existing file instead.
overwrite: true

# If set to true, an **existing** setting for GRUB_DISTRIBUTOR is
# kept, not updated to the *bootloaderEntryName* from the branding file.
# Use this if the GRUB_DISTRIBUTOR setting in the file is "smart" in
# some way (e.g. uses shell-command substitution).
keepDistributor: false

# Kernel parameters written to GRUB_CMDLINE_LINUX_DEFAULT.
# - quiet: suppress kernel log output
# - loglevel=2: only critical kernel messages reach the VT console; all
#   warnings/errors remain in the journal. This hides noisy but harmless
#   messages such as ACPI [Firmware Bug] or piix4_smbus on VMware.
# - vt.global_cursor_default=0: hide the blinking cursor on virtual terminals
# If plymouth is detected in the target system, the module appends "splash".
kernel_params: [ "quiet", "loglevel=2", "systemd.show_status=0", "vt.global_cursor_default=0" ]

# Default entries to write to /etc/default/grub if it does not exist yet or if
# we are overwriting it.
#
# - gfxterm keeps GRUB in graphical mode instead of the VGA text console.
# - GRUB_GFXPAYLOAD_LINUX=keep keeps the framebuffer mode when handing over
#   to the kernel/Plymouth, avoiding a text-mode flash.
# - GRUB_BACKGROUND uses the CutefishOS default wallpaper as the GRUB menu
#   background (Debian's grub-mkconfig reads GRUB_BACKGROUND).
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DISTRIBUTOR: "cutefish"
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "gfxterm"
    GRUB_GFXMODE: "auto"
    GRUB_GFXPAYLOAD_LINUX: "keep"
    GRUB_BACKGROUND: "/usr/share/backgrounds/cutefishos/boot-background.png"
    GRUB_DISABLE_RECOVERY: true
    GRUB_ENABLE_CRYPTODISK: true

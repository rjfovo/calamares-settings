# Disable the tty1 getty in the installed system. The active VT is tty1 after
# Plymouth exits; if getty@tty1 is enabled there, a login prompt flashes
# before SDDM's X server switches to its own VT. SDDM normally opens the next
# free VT (vt2), so tty1 remains free/blank.
units:
  - name: "getty@tty1.service"
    action: "disable"
    mandatory: false
  - name: "sddm.service"
    action: "enable"
    mandatory: false
